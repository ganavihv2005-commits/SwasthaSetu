    <script>
      // In AI Studio preview, HMR is disabled. Intercept and suppress benign WebSocket connection notices.
      (function() {
        var isWsError = function(str) {
          if (!str) return false;
          var s = String(str);
          return s.indexOf('WebSocket') !== -1 || s.indexOf('ws://') !== -1 || s.indexOf('wss://') !== -1 || s.indexOf('closed without opened') !== -1;
        };

        window.addEventListener('error', function (e) {
          var msg = (e && e.message) || (e && e.error && e.error.message) || '';
          if (isWsError(msg)) {
            e.preventDefault();
            e.stopPropagation();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function (e) {
          var reason = (e && e.reason && (e.reason.message || e.reason.stack || e.reason)) || '';
          if (isWsError(reason)) {
            e.preventDefault();
            e.stopPropagation();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);

        var origError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          var joined = args.map(function(a) {
            return (a && a.stack) || (a && a.message) || String(a);
          }).join(' ');
          if (isWsError(joined)) {
            return;
          }
          return origError.apply(console, arguments);
        };
      })();
    </script>
